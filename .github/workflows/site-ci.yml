name: AWARESPAN Landing Page CI
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'scripts/**', 'package.json', 'package-lock.json', 'vite.config.*', '.github/workflows/site-ci.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'public/**', 'scripts/**', 'package.json', 'package-lock.json', 'vite.config.*', '.github/workflows/site-ci.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
